name: Helper tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - uses: actions/upload-artifact@v4
        with:
          name: imageannot-preview
          retention-days: 1
          path: |
            *.html
            *.js
            *.css
            *.md
            *.json
            *.svg
            reference/
            tests/
