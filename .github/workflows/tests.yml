name: Helper tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - name: Install browser test dependencies (not app dependencies)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Drawing, export and notation browser tests
        run: |
          node tests/browser.mjs
          node tests/notation.browser.mjs
      - name: Browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imageannot-browser-checks
          retention-days: 3
          path: test-results/
